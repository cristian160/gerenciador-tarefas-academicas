<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciador de Tarefas Acadêmicas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <strong>Gerenciador de Tarefas Acadêmicas</strong>
    <small>Planejamento de estudos, entregas e leituras sem distrações</small>
    <span class="perfil" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a7 5 0 0 1 14 0v2z"/></svg></span>
  </header>
  <main>
    <div class="introducao"><small>Semestre letivo • Painel de controle</small>
      <h1>Caderno de Atividades</h1></div>

    <form id="form-tarefa" autocomplete="off">
      <h2 id="titulo-formulario">Nova tarefa</h2>

      <label for="titulo">Título da tarefa</label>
      <input id="titulo" name="titulo" type="text" maxlength="120" required
             placeholder="Ex.: Entregar relatório">

      <label for="disciplina">Disciplina</label>
      <input id="disciplina" name="disciplina" type="text" maxlength="80" required
             placeholder="Ex.: Algoritmos">

      <div class="acoes-formulario">
        <button type="submit" id="btn-salvar" class="btn-primario">Adicionar tarefa</button>
        <button type="button" id="btn-cancelar" class="btn-secundario" hidden>Cancelar</button>
      </div>
      <p id="mensagem" role="alert"></p>
    </form>

    <section aria-labelledby="titulo-pendentes">
      <h2 id="titulo-pendentes">Pendentes<span class="contador" id="total-pendentes"></span></h2>
      <ul id="lista-pendentes"></ul>
    </section>

    <section aria-labelledby="titulo-concluidas">
      <h2 id="titulo-concluidas">Concluídas<span class="contador" id="total-concluidas"></span></h2>
      <ul id="lista-concluidas"></ul>
    </section>
  </main>

  <footer>Caderno Técnico Acadêmico • Ambiente Focado • Sem Distrações</footer>
  <script src="app.js"></script>
</body>
</html>
